name: Hisse analiz pipeline

# Günlük: yalnızca Python (fiyat, haber başlıkları, insider, büyük hareketler, kurallar). Claude YOK.
# Claude (abonelik, claude -p, claude-opus-5-5) yalnızca:
#   1) yeni 10-Q/10-K geldiğinde (günlük çalışma tespit eder), 2) her Salı 23:00 Berlin raporu.
on:
  schedule:
    - cron: "0 5 * * 1-5"   # hafta içi 05:00 UTC — günlük Python çalışması
    - cron: "0 21 * * 2"    # Salı 21:00 UTC = 23:00 Berlin YAZ saati (CEST, UTC+2)
    - cron: "0 22 * * 2"    # Salı 22:00 UTC = 23:00 Berlin KIŞ saati (CET, UTC+1)
    # İki Salı cron'undan yalnızca o günkü Berlin saat dilimine uyanı çalışır (aşağıdaki "Mod" adımı).
  workflow_dispatch:
    inputs:
      sali_raporu:
        description: "Salı raporunu (Claude) şimdi üret"
        type: boolean
        default: false
      bilanco_claude:
        description: "Bu hisselerin son 10-Q/10-K'sını Claude ile yeniden analiz et (virgülle, ör. NVDA,AAOI)"
        type: string
        default: ""
      force_filings:
        description: "XBRL bilanço tablosunu yeni dosya olmasa da yeniden kur (Python)"
        type: boolean
        default: false
      skip_claude:
        description: "Claude adımlarını atla"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "config/**"
      - "pipeline/**"
      - "site/**"
      - ".github/workflows/hisse.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hisse-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      run: ${{ steps.mod.outputs.run }}
    steps:
      - name: Mod
        id: mod
        run: |
          WEEKLY=false; RUN=true
          OFF=$(TZ=Europe/Berlin date +%z)
          SCHED="${{ github.event.schedule }}"
          if [ "$SCHED" = "0 21 * * 2" ]; then
            if [ "$OFF" = "+0200" ]; then WEEKLY=true; else RUN=false; fi
          elif [ "$SCHED" = "0 22 * * 2" ]; then
            if [ "$OFF" = "+0100" ]; then WEEKLY=true; else RUN=false; fi
          fi
          [ "${{ inputs.sali_raporu }}" = "true" ] && WEEKLY=true
          echo "Berlin ofset: $OFF · Salı raporu: $WEEKLY · çalış: $RUN"
          echo "weekly=$WEEKLY" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.mod.outputs.run == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.mod.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Python bağımlılıkları
        if: steps.mod.outputs.run == 'true'
        run: pip install -r pipeline/requirements.txt

      - name: SEC dosya cache'i
        if: steps.mod.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-

      - name: Günlük veri (yalnızca Python)
        id: daily
        if: steps.mod.outputs.run == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          ARGS=""
          [ "${{ inputs.force_filings }}" = "true" ] && ARGS="--force-filings"
          python pipeline/run.py $ARGS

      - name: Claude gerekli mi?
        id: need
        if: steps.mod.outputs.run == 'true'
        run: |
          FIL="${{ steps.daily.outputs.claude_filings }}"
          [ -n "${{ inputs.bilanco_claude }}" ] && FIL="${{ inputs.bilanco_claude }}"
          NEED=false
          if [ "${{ inputs.skip_claude }}" != "true" ] && [ "${{ github.event_name }}" != "push" ]; then
            if [ -n "$FIL" ] || [ "${{ steps.mod.outputs.weekly }}" = "true" ]; then NEED=true; fi
          fi
          echo "Bilanço: '$FIL' · Salı: ${{ steps.mod.outputs.weekly }} · Claude: $NEED"
          echo "filings=$FIL" >> "$GITHUB_OUTPUT"
          echo "need=$NEED" >> "$GITHUB_OUTPUT"

      - name: Claude Code CLI kur
        if: steps.need.outputs.need == 'true'
        run: npm install -g @anthropic-ai/claude-code && claude --version

      - name: Claude görevleri (abonelik)
        if: steps.need.outputs.need == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          ARGS=""
          [ -n "${{ steps.need.outputs.filings }}" ] && ARGS="--filings ${{ steps.need.outputs.filings }}"
          [ "${{ steps.mod.outputs.weekly }}" = "true" ] && ARGS="$ARGS --weekly"
          python pipeline/claude_tasks.py $ARGS
          python pipeline/run.py --offline

      - name: Çalışma özeti
        if: always() && steps.mod.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json, os
          try:
              runs = json.load(open("data/runs.json"))
          except Exception as e:
              print("runs.json okunamadı:", e); raise SystemExit
          lines = []
          for r in runs[:2]:
              lines.append(f"### {r['tur']} · {r['id']}")
              if r.get("claude"):
                  c = r["claude"]
                  lines.append(f"- Claude ({r.get('model')}): {c['cagri']} çağrı · input {c['input_tokens']:,} · output {c['output_tokens']:,} · web {c['web_search']} · API eşdeğeri ${c['api_esdegeri_usd']:.2f} (abonelikte faturalanmaz)")
              else:
                  lines.append(f"- Finnhub: {r.get('finnhub_aktif')} · SEC: {r.get('sec_aktif')} · bekleyen bilanço: {r.get('bekleyen_bilanco')}")
              lines += [f"- HATA {h['adim']} {h.get('ticker') or ''}: {h['hata']}" for h in r.get("hatalar", [])]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Veriyi commit'le
        if: (success() || failure()) && steps.mod.outputs.run == 'true'
        run: |
          git config user.name "hisse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "veri: $(date -u +%Y-%m-%dT%H:%MZ) otomatik güncelleme"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

  # GitHub Pages: site/ + data/ -> _site (Settings → Pages → Source: "GitHub Actions" olmalı)
  deploy:
    needs: pipeline
    if: always() && github.ref == 'refs/heads/main' && needs.pipeline.outputs.run == 'true' && needs.pipeline.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Site paketini hazırla
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4
