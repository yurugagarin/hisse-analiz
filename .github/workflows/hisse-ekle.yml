name: Hisse ekle / çıkar

# Üç yoldan tetiklenir:
#  1. Sitedeki "Hisseleri yönet" sayfası (GitHub bağlantısı kuruluysa doğrudan bu iş akışını başlatır)
#  2. Sitedeki sayfa, bağlantı yoksa GitHub'da hazır doldurulmuş bir issue açar ("hisse ekle CEG");
#     issue'yu yalnızca repo sahibi açtıysa işlenir, sonuç issue'ya yazılır ve issue kapatılır.
#  3. GitHub → Actions → "Hisse ekle / çıkar" → Run workflow (elle)
on:
  workflow_dispatch:
    inputs:
      islem:
        description: "Ne yapılsın?"
        type: choice
        options: [ekle, cikar]
        default: ekle
      ticker:
        description: "Borsa kodu (ör. AMD, GOOGL, CEG). Emin değilsen sitedeki arama kutusunu kullan."
        type: string
        required: true
      ad:
        description: "Şirket adı (boş bırak: SEC'ten otomatik alınır)"
        type: string
        default: ""
      benchmarks:
        description: "Karşılaştırma ETF'leri, virgülle (boş bırak: şirketin sektörüne göre otomatik seçilir)"
        type: string
        default: ""
  issues:
    types: [opened]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: hisse-pipeline-refs/heads/main
  cancel-in-progress: false

jobs:
  manage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'hisse '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Listeyi güncelle
        id: m
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EVENT: ${{ github.event_name }}
          ISLEM: ${{ inputs.islem }}
          TICKER: ${{ inputs.ticker }}
          AD: ${{ inputs.ad }}
          BM: ${{ inputs.benchmarks }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT" = "issues" ]; then
            python pipeline/manage.py --issue
          else
            python pipeline/manage.py "$ISLEM" "$TICKER" --ad "$AD" --benchmarks "$BM"
          fi

      - name: Commit'le
        id: c
        if: steps.m.outputs.ok == 'true'
        env:
          ISLEM: ${{ steps.m.outputs.islem }}
          TICKER: ${{ steps.m.outputs.ticker }}
        run: |
          git config user.name "hisse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config
          if git diff --cached --quiet; then echo "Değişiklik yok"; echo "degisti=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "config: ${ISLEM} ${TICKER}"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          echo "degisti=true" >> "$GITHUB_OUTPUT"

      - name: Veri pipeline'ını başlat
        if: steps.c.outputs.degisti == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run hisse.yml --ref main -R "${{ github.repository }}"

      - name: Sonucu issue'ya yaz
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
          OK: ${{ steps.m.outputs.ok }}
          MSG: ${{ steps.m.outputs.mesaj }}
          CHANGED: ${{ steps.c.outputs.degisti }}
        run: |
          if [ "$OK" = "true" ]; then
            note=""; [ "$CHANGED" = "true" ] && note=$'\n\nVeriler hazırlanıyor; birkaç dakika içinde sitede görünür.'
            gh issue close "$NUM" -R "${{ github.repository }}" --reason completed --comment "✅ ${MSG}${note}"
          else
            gh issue close "$NUM" -R "${{ github.repository }}" --reason "not planned" --comment "❌ ${MSG:-İşlem başarısız; ayrıntı için Actions kaydına bak.}"
          fi

      - name: Sonuç
        if: steps.m.outputs.ok != 'true'
        run: |
          echo "İşlem yapılamadı (mesaj yukarıda)."
          exit 1
