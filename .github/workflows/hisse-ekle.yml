name: Hisse ekle / çıkar

# GitHub → Actions → "Hisse ekle / çıkar" → Run workflow. Telefondaki GitHub uygulamasından da çalışır.
on:
  workflow_dispatch:
    inputs:
      islem:
        description: "Ne yapılsın?"
        type: choice
        options: [ekle, cikar]
        default: ekle
      ticker:
        description: "Borsa kodu (ör. AMD, GOOGL, TSM)"
        type: string
        required: true
      ad:
        description: "Şirket adı (boş bırak: SEC'ten otomatik alınır)"
        type: string
        default: ""
      benchmarks:
        description: "Karşılaştırma ETF'leri, virgülle (boş bırak: QQQ, SMH). Yazılım için IGV, iletişim için XLC, genel piyasa için SPY."
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: hisse-pipeline-refs/heads/main
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Listeyi güncelle
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ISLEM: ${{ inputs.islem }}
          TICKER: ${{ inputs.ticker }}
          AD: ${{ inputs.ad }}
          BM: ${{ inputs.benchmarks }}
        run: python pipeline/manage.py "$ISLEM" "$TICKER" --ad "$AD" --benchmarks "$BM"

      - name: Commit'le
        env:
          ISLEM: ${{ inputs.islem }}
          TICKER: ${{ inputs.ticker }}
        run: |
          git config user.name "hisse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "config: ${ISLEM} ${TICKER}"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

      - name: Veri pipeline'ını başlat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run hisse.yml --ref main -R "${{ github.repository }}"
