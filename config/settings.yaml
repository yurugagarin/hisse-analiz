# Genel ayarlar. Gizli anahtarlar burada DEĞİL, GitHub Secrets'ta durur.
default_benchmarks: [QQQ, SMH]

claude:
  # ANA ŞALTER: false iken site Claude'u HİÇ çalıştırmaz (Salı raporu, yeni 10-Q/10-K analizi, elle başlatma dahil)
  # ve Pro planından hiçbir şey harcanmaz. Açmak için true yap.
  aktif: false
  # Claude Code CLI (`claude -p`) + abonelik OAuth token'ı (CLAUDE_CODE_OAUTH_TOKEN).
  # ANTHROPIC_API_KEY KULLANILMAZ. Model CLAUDE_MODEL değişkeniyle geçersiz kılınabilir.
  model: claude-opus-5-5
  # Claude yalnızca: (1) yeni 10-Q/10-K geldiğinde, (2) Salı 23:00 (Berlin) raporunda çalışır.
  max_turns:
    bilanco: 20
    sali_raporu: 60

news:
  lookback_days: 7
  top_n: 3
  archive_days: 45

moves:
  # Günlük kapanıştan kapanışa bu yüzdeden büyük hareketler kaydedilir
  threshold_pct: 5
  lookback_days: 30

insider:
  windows: [90, 180]
  # Kümelenmiş satış: bu kadar gün içinde en az N farklı yönetici satış yaptıysa
  cluster_window_days: 14
  cluster_min_insiders: 3
  # "Alım yokken fiyat yükseldi" uyarısı için 180 günlük fiyat artışı eşiği (%)
  rally_without_buys_pct: 30

signals:
  horizons_days: [30, 90, 180]
