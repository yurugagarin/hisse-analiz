# =====================================================================
# KURAL BAZLI ALIM TAKİBİ — TASLAK. Emre onaylayacak.
# Otomatik işlem YOK. Site sadece bilgilendirir.
#
# kademeler: 52 haftalık zirveden düşüş eşikleri (%) ve o eşikte ne yapacağını
#            önceden yazdığın not.
# kosul: tez_saglam -> kademe tetiklense bile tez durumu KIRMIZI ise site
#        "koşul sağlanmıyor" der.
# sirkete_ozel_esik: hissenin zirveden düşüşü, benchmark'ların düşüşünden bu
#        kadar puan fazlaysa düşüş "şirkete özel" sayılır; aksi halde
#        "sektör/piyasa kaynaklı".
# =====================================================================
varsayilan:
  onay: taslak
  kosul: tez_saglam
  sirkete_ozel_esik: 10
  kademeler:
    - {dusus: 15, not: "Haftalık DCA tutarını 1,5x yap (tez sağlamsa)."}
    - {dusus: 25, not: "Haftalık DCA tutarını 2x yap; bilançoyu yeniden oku."}
    - {dusus: 35, not: "Ek tek seferlik alım düşün; önce şeytanın avukatı bölümünü oku."}

NVDA:
  onay: taslak
  kosul: tez_saglam
  sirkete_ozel_esik: 10
  kademeler:
    - {dusus: 15, not: "DCA 1,5x (tez sağlamsa)."}
    - {dusus: 25, not: "DCA 2x; stok ve brüt marj sütunlarını kontrol et."}
    - {dusus: 35, not: "Ek alım düşün; önce şeytanın avukatını oku."}

