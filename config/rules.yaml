  onay: taslak
  kosul: tez_saglam
  sirkete_ozel_esik: 10
  kademeler:
    - {dusus: 15, not: "DCA 1,5x (tez sağlamsa)."}
    - {dusus: 25, not: "DCA 2x; capex ve FCF sütununu kontrol et."}
    - {dusus: 35, not: "Ek alım düşün; regülasyon haberlerini oku."}

NOW:
  onay: taslak
  kosul: tez_saglam
  sirkete_ozel_esik: 10
  kademeler:
    - {dusus: 15, not: "DCA 1,5x (tez sağlamsa)."}
    - {dusus: 25, not: "DCA 2x; RPO ve SBC sütunlarını kontrol et."}
    - {dusus: 35, not: "Ek alım düşün; önce şeytanın avukatını oku."}

AAOI:
  onay: taslak
  kosul: tez_saglam
  # Küçük ve oynak hisse: kademeler daha geniş
  sirkete_ozel_esik: 15
  kademeler:
    - {dusus: 25, not: "DCA 1,5x (tez sağlamsa)."}
    - {dusus: 40, not: "DCA 2x; nakit pisti ve sulandırmayı kontrol et."}
    - {dusus: 55, not: "Pozisyon büyüklüğünü sınırla; tez gerçekten sağlam mı yeniden yaz."}
