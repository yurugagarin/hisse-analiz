# =====================================================================
# YATIRIM TEZLERİ — TASLAK. Emre onaylayacak.
# ---------------------------------------------------------------------
# Bu dosyadaki eşikler bir görüştür, olgu değildir. Claude tarafından
# başlangıç taslağı olarak yazıldı; onaylayana kadar sitede
# "TASLAK — Emre onaylayacak" etiketiyle görünür.
# Onayladığında ilgili hissede `onay: taslak` -> `onay: onaylandi` yap.
#
# SÜTUN (pillar) TİPLERİ
#   tip: metrik  -> SEC XBRL verisinden otomatik hesaplanır (deterministik)
#   tip: yorum   -> Claude, 10-Q/10-K metni + basın bülteninden değerlendirir.
#                   Sitede "YORUM" olarak ayrı gösterilir; kanıt alıntısı zorunlu.
#
# METRİK KATALOĞU (tip: metrik için `metrik:` alanı)
#   revenue_yoy            Çeyreklik gelir, yıllık büyüme (%)
#   revenue_ttm_yoy        Son 4 çeyrek (TTM) gelir büyümesi (%)
#   gross_margin           Çeyreklik brüt marj (%)
#   gross_margin_ttm       TTM brüt marj (%)
#   operating_margin       Çeyreklik faaliyet marjı (%)
#   operating_margin_ttm   TTM faaliyet marjı (%)
#   ocf_to_ni_ttm          TTM işletme nakit akışı / net kâr (x)
#   fcf_margin_ttm         TTM serbest nakit akışı / gelir (%)
#   sbc_to_revenue_ttm     TTM hisse bazlı ödeme / gelir (%)
#   diluted_shares_yoy     Seyreltilmiş ağırlıklı hisse sayısı yıllık değişim (%)
#   dso                    Alacak tahsil süresi (gün)
#   receivables_vs_revenue_gap  Alacak büyümesi − gelir büyümesi (puan)
#   inventory_yoy          Stok yıllık değişim (%)
#   inventory_vs_revenue_gap    Stok büyümesi − gelir büyümesi (puan)
#   dio                    Stok devir süresi (gün)
#   deferred_revenue_yoy   Ertelenmiş gelir (sözleşme yükümlülüğü) yıllık değişim (%)
#   rpo_yoy                Kalan edim yükümlülüğü (RPO) yıllık değişim (%)
#   capex_to_revenue_ttm   TTM yatırım harcaması / gelir (%)
#   cash_runway_months     Nakit pisti (ay) — sadece nakit yakan şirkette anlamlı
#
# DEĞERLENDİRME
#   operator ">" : değer >= esik -> YEŞİL; >= uyari -> SARI; aksi KIRMIZI
#   operator "<" : değer <= esik -> YEŞİL; <= uyari -> SARI; aksi KIRMIZI
#   Veri yoksa: GRİ "veri yok".
#
# ÇIKIŞ KRİTERLERİ: `ardisik_ceyrek: N` -> koşul son N çeyrek üst üste
# sağlanırsa tetiklenir. Tetiklenmesi "sat" demek DEĞİLDİR; önceden yazdığın
# kuralı hatırlatır.
# =====================================================================

NVDA:
  onay: taslak
  ozet: >
    Hızlandırılmış hesaplama (GPU + ağ + yazılım yığını) için talep, hyperscaler ve
    kurumsal AI yatırımlarıyla yüksek büyümeyi sürdürüyor; yazılım/ekosistem kilidi
    sayesinde yüksek brüt marj korunuyor ve kâr nakde dönüşüyor.
  sutunlar:
    - id: buyume
      ad: Talep ve büyüme
      tip: metrik
      metrik: revenue_yoy
      operator: ">"
      esik: 25
      uyari: 10
      aciklama: "Çeyreklik gelirin yıllık büyümesi > %25 ise tez sağlam; %10'un altı talep yavaşlaması sinyali."
    - id: fiyatlama_gucu
      ad: Fiyatlama gücü (brüt marj)
      tip: metrik
      metrik: gross_margin
      operator: ">"
      esik: 70
      uyari: 65
      aciklama: "Brüt marj > %70 rekabetin fiyatı henüz aşındırmadığını gösterir."
    - id: kazanc_kalitesi
      ad: Kâr nakde dönüşüyor mu
      tip: metrik
      metrik: ocf_to_ni_ttm
      operator: ">"
      esik: 0.9
      uyari: 0.7
      aciklama: "TTM işletme nakit akışı / net kâr > 0,9."
    - id: stok_disiplini
      ad: Stok ve kanal disiplini
      tip: metrik
      metrik: inventory_vs_revenue_gap
      operator: "<"
      esik: 20
      uyari: 45
      aciklama: "Stok büyümesi gelir büyümesini 20 puandan fazla aşmamalı; aşarsa talep/ürün geçişi riski."
    - id: rekabet_musteri
      ad: Rekabet ve müşteri yoğunlaşması
      tip: yorum
      soru: >
        10-Q/10-K ve basın bülteninde; doğrudan müşteri yoğunlaşması (en büyük
        müşterilerin gelir payı), özel çip (TPU/ASIC) ve rakip hızlandırıcılar,
        ihracat kısıtları hakkında yönetimin söyledikleri tezi zayıflatıyor mu?
  cikis_kriterleri:
    - id: gelir_daralmasi
      ad: "Gelir 2 çeyrek üst üste yıllık bazda daralırsa"
      metrik: revenue_yoy
      operator: "<"
      esik: 0
      ardisik_ceyrek: 2
    - id: marj_kirilmasi
      ad: "Brüt marj 2 çeyrek üst üste %60'ın altına inerse"
      metrik: gross_margin
      operator: "<"
      esik: 60
      ardisik_ceyrek: 2
    - id: stok_sisme
      ad: "Stok büyümesi gelir büyümesini 2 çeyrek üst üste 60 puandan fazla aşarsa"
      metrik: inventory_vs_revenue_gap
      operator: ">"
      esik: 60
      ardisik_ceyrek: 2

META:
  onay: taslak
  ozet: >
    Reklam motoru (Family of Apps) AI destekli hedefleme ile çift haneli büyümeyi ve
    yüksek faaliyet marjını koruyor; ağır AI yatırımına rağmen serbest nakit akışı
    pozitif kalıyor ve hisse geri alımı sulandırmayı telafi ediyor.
  sutunlar:
    - id: reklam_buyumesi
      ad: Reklam motoru büyümesi
      tip: metrik
      metrik: revenue_yoy
      operator: ">"
      esik: 12
      uyari: 5
      aciklama: "Gelir büyümesi > %12."
    - id: marj
      ad: Faaliyet marjı
      tip: metrik
      metrik: operating_margin_ttm
      operator: ">"
      esik: 35
      uyari: 28
      aciklama: "TTM faaliyet marjı > %35 (Reality Labs zararları dahil, konsolide)."
    - id: capex_nakit
      ad: AI yatırımına rağmen nakit üretimi
      tip: metrik
      metrik: fcf_margin_ttm
      operator: ">"
      esik: 10
      uyari: 0
      aciklama: "TTM serbest nakit akışı marjı > %10; negatife dönerse capex kârı yiyor demektir."
    - id: sulandirma
      ad: Hisse sayısı (geri alım vs SBC)
      tip: metrik
      metrik: diluted_shares_yoy
      operator: "<"
      esik: 0
      uyari: 2
      aciklama: "Seyreltilmiş hisse sayısı yıllık bazda azalıyor olmalı."
    - id: ai_getirisi
      ad: AI yatırımının getirisi ve regülasyon
      tip: yorum
      soru: >
        10-Q/10-K ve basın bülteninde reklam gösterimi ve reklam başına ortalama fiyat
        eğilimleri, capex guidance'ı ve AB/ABD regülasyon riskleri hakkında yönetimin
        açıklamaları tezi destekliyor mu, zayıflatıyor mu?
  cikis_kriterleri:
    - id: buyume_coker
      ad: "Gelir büyümesi 2 çeyrek üst üste %5'in altına inerse"
      metrik: revenue_yoy
      operator: "<"
      esik: 5
      ardisik_ceyrek: 2
    - id: fcf_negatif
      ad: "TTM serbest nakit akışı 2 çeyrek üst üste negatif olursa"
      metrik: fcf_margin_ttm
      operator: "<"
      esik: 0
      ardisik_ceyrek: 2

