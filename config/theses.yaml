    Kurumsal iş akışı platformu yüksek yenileme oranı ve genişleyen ürün (AI/Now Assist)
    satışıyla %20 civarı büyümeyi sürdürüyor; sözleşmeli gelir birikimi (RPO) görünürlük
    sağlıyor ve güçlü FCF marjı SBC maliyetine rağmen gerçek değer yaratıyor.
  sutunlar:
    - id: buyume
      ad: Gelir büyümesi
      tip: metrik
      metrik: revenue_yoy
      operator: ">"
      esik: 18
      uyari: 12
      aciklama: "Çeyreklik gelir büyümesi > %18."
    - id: gorunurluk
      ad: Sözleşmeli gelir birikimi (RPO)
      tip: metrik
      metrik: rpo_yoy
      operator: ">"
      esik: 18
      uyari: 12
      aciklama: "RPO yıllık büyümesi gelir büyümesine yakın veya üzerinde olmalı."
    - id: nakit
      ad: Serbest nakit akışı marjı
      tip: metrik
      metrik: fcf_margin_ttm
      operator: ">"
      esik: 25
      uyari: 18
      aciklama: "TTM FCF marjı > %25."
    - id: sbc
      ad: SBC maliyeti
      tip: metrik
      metrik: sbc_to_revenue_ttm
      operator: "<"
      esik: 15
      uyari: 20
      aciklama: "SBC/gelir < %15; SBC hariç FCF'nin şişirilmiş görünmemesi için."
    - id: ai_ve_yenileme
      ad: AI monetizasyonu ve müşteri tutma
      tip: yorum
      soru: >
        10-Q/10-K ve basın bülteninde yenileme oranı, büyük müşteri (yıllık 5M$+ ACV) sayısı,
        Now Assist/AI ürünlerinin katkısı ve satın almaların büyümeye etkisi hakkında
        açıklamalar tezi destekliyor mu?
  cikis_kriterleri:
    - id: rpo_yavas
      ad: "RPO büyümesi 2 çeyrek üst üste %12'nin altına inerse"
      metrik: rpo_yoy
      operator: "<"
      esik: 12
      ardisik_ceyrek: 2
    - id: gelir_yavas
      ad: "Gelir büyümesi 2 çeyrek üst üste %12'nin altına inerse"
      metrik: revenue_yoy
      operator: "<"
      esik: 12
      ardisik_ceyrek: 2

AAOI:
  onay: taslak
  ozet: >
    Veri merkezi optik alıcı-vericilerde (400G/800G ve sonrası) hyperscaler talebiyle hızlı
    büyüme; ABD içi üretim kapasitesi avantaj sağlıyor. Şirket kârlılığa geçiş aşamasında,
    bu yüzden kazanç kalitesi, nakit pisti ve sulandırma kritik.
  sutunlar:
    - id: buyume
      ad: Gelir büyümesi
      tip: metrik
      metrik: revenue_yoy
      operator: ">"
      esik: 30
      uyari: 10
      aciklama: "Çeyreklik gelir büyümesi > %30."
    - id: brut_marj
      ad: Brüt marj
      tip: metrik
      metrik: gross_margin
      operator: ">"
      esik: 30
      uyari: 25
      aciklama: "GAAP brüt marj > %30; ürün karması ve ölçek etkisini gösterir."
    - id: faaliyet_kari
      ad: Faaliyetten kârlılığa geçiş
      tip: metrik
      metrik: operating_margin_ttm
      operator: ">"
      esik: 0
      uyari: -10
      aciklama: "TTM faaliyet marjı pozitif olmalı; warrant/türev kazançları bu metriği etkilemez."
    - id: sulandirma
      ad: Sulandırma
      tip: metrik
      metrik: diluted_shares_yoy
      operator: "<"
      esik: 10
      uyari: 25
      aciklama: "Seyreltilmiş hisse sayısı yıllık artışı < %10 (ATM/convertible ihraçları)."
    - id: stok
      ad: Stok ve talep uyumu
      tip: metrik
      metrik: inventory_vs_revenue_gap
      operator: "<"
      esik: 25
      uyari: 60
      aciklama: "Stok büyümesi gelir büyümesini 25 puandan fazla aşmamalı."
    - id: musteri_kapasite
      ad: Müşteri yoğunlaşması ve kapasite
      tip: yorum
      soru: >
        10-Q/10-K dipnotlarında en büyük müşterilerin gelir payı, 800G/1.6T ürün geçişi,
        ABD (Texas) üretim kapasitesi ve finansman (ATM, convertible) hakkında açıklamalar
        tezi destekliyor mu?
  cikis_kriterleri:
    - id: pist
      ad: "Nakit pisti 12 ayın altına inerse"
      metrik: cash_runway_months
      operator: "<"
      esik: 12
      ardisik_ceyrek: 1
    - id: marj_coker
      ad: "Brüt marj 2 çeyrek üst üste %20'nin altına inerse"
      metrik: gross_margin
      operator: "<"
      esik: 20
      ardisik_ceyrek: 2
    - id: asiri_sulandirma
      ad: "Seyreltilmiş hisse sayısı yıllık %40'tan fazla artarsa"
      metrik: diluted_shares_yoy
      operator: ">"
      esik: 40
      ardisik_ceyrek: 1

