  onay: taslak
  # OTOMATİK ŞABLON: eşikler şirketin bugünkü rakamlarına göre (son yıllık büyüme %287) "mevcut kaliteyi koru"
  # mantığıyla önerildi. Kendi tezine göre düzenle; özet ve yorum sütununu kendi cümlelerinle yaz.
  ozet: >
    Ionq için tez henüz yazılmadı. Bu otomatik taslak yalnızca büyümenin, marjın, nakit üretiminin
    ve hisse sayısının bugünkü seviyesini koruyup korumadığını izler.
  sutunlar:
    - {id: buyume, ad: "Gelir büyümesi", tip: metrik, metrik: revenue_yoy, operator: ">", esik: 143, uyari: 57}
    - {id: brut_marj, ad: "Brüt marj", tip: metrik, metrik: gross_margin, operator: ">", esik: 40, uyari: 30}
    - {id: karlilik, ad: "Kârlılığa gidiş", tip: metrik, metrik: operating_margin_ttm, operator: ">", esik: 0, uyari: -413}
    - {id: pist, ad: "Nakit pisti", tip: metrik, metrik: cash_runway_months, operator: ">", esik: 24, uyari: 12}
    - {id: sulandirma, ad: "Hisse sayısı", tip: metrik, metrik: diluted_shares_yoy, operator: "<", esik: 2, uyari: 5}
    - id: rekabet
      ad: "Rekabet ve yönetim"
      tip: yorum
      soru: >
        10-Q/10-K ve basın bülteninde rekabet, müşteri yoğunlaşması ve yönetimin beklentileri
        hakkındaki açıklamalar tezi destekliyor mu?
